<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>3D island experiment</title>
  <style>
    :root { color-scheme: dark; font-family: system-ui, -apple-system, sans-serif; background: #0b1832; color: #f7f4e9; }
    * { box-sizing: border-box; }
    body { margin: 0; }
    main { min-height: 100svh; display: flex; flex-direction: column; align-items: center; text-align: center; overflow: hidden; }
    header { padding: max(2.5rem, env(safe-area-inset-top)) 1rem 0; }
    h1 { margin: 0; font-size: clamp(2.1rem, 5vw, 3.6rem); line-height: 1.05; letter-spacing: -.045em; }
    header p { margin: .6rem 0 0; color: #b8c9e0; font-size: clamp(.9rem, 2vw, 1.05rem); }
    .stage { position: relative; width: min(100%, 900px); height: min(68svh, 650px); min-height: 320px; margin: auto; }
    canvas { display: block; width: 100%; height: 100%; }
    .status { position: absolute; top: 50%; left: 0; right: 0; color: #c4d2e6; }
    footer { padding: 1rem 1rem 2rem; color: #afc0d8; font-size: .85rem; }
    button { padding: .6rem 1rem; border: 1px solid #7690a8; border-radius: 2rem; background: transparent; color: inherit; font: inherit; cursor: pointer; }
    button:hover, button:focus-visible { color: #fff; border-color: #fff; }
    @media (max-width: 600px) { header { padding-top: max(3rem, env(safe-area-inset-top)); } .stage { width: 100%; height: min(62svh, 550px); } }
  </style>
</head>
<body>
  <main>
    <header><h1>Philip Brocoum</h1><p>Lead Software Engineer · Portland, Oregon</p></header>
    <div class="stage" role="img" aria-label="A small 3D island with a pine tree, a campfire, and a developer working at a computer, surrounded by rippling water."><canvas></canvas><p class="status" role="status">Loading island…</p></div>
    <footer><button type="button" aria-pressed="false">Pause animation</button></footer>
  </main>
  <script src="bundle.js" defer></script>
</body>
</html>
