<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Island illustration experiment</title>
  <style>
    :root { color-scheme: dark; font-family: system-ui, -apple-system, BlinkMacSystemFont, sans-serif; background: #09172e; color: #f8f5ea; }
    * { box-sizing: border-box; }
    body { margin: 0; }
    .hero { min-height: 100svh; display: flex; flex-direction: column; align-items: center; justify-content: center; overflow: hidden; background: radial-gradient(ellipse at 50% 58%, #142e56 0%, #0c1d39 62%, #09172e 100%); }
    .intro { position: relative; z-index: 1; padding: 3rem 1.25rem 0; text-align: center; }
    .intro p { margin: .5rem 0 0; color: #bfcde0; font-size: clamp(.9rem, 2vw, 1.1rem); letter-spacing: .03em; }
    .intro h1 { margin: 0; font-size: clamp(2rem, 5vw, 3.8rem); letter-spacing: -.045em; line-height: 1.05; }
    .scene { position: relative; width: min(100%, 1280px); aspect-ratio: 16 / 9; margin: clamp(1rem, 3vw, 2.5rem) auto 0; isolation: isolate; }
    .scene img { display: block; width: 100%; height: 100%; object-fit: cover; mask-image: linear-gradient(transparent, #000 12%, #000 78%, transparent); }
    .water { position: absolute; inset: 0; overflow: hidden; pointer-events: none; }
    .ripple { position: absolute; width: var(--w); aspect-ratio: 8 / 1; left: var(--x); top: var(--y); border: 1px solid rgb(165 211 247 / .48); border-radius: 50%; opacity: 0; animation: ripple 6s ease-out infinite; animation-delay: var(--delay); }
    .ripple::after { content: ''; position: absolute; inset: 110% 15% -110%; border: 1px solid rgb(165 211 247 / .26); border-radius: 50%; }
    @keyframes ripple { 0% { opacity: 0; transform: scale(.65); } 20% { opacity: .7; } 80% { opacity: .35; } 100% { opacity: 0; transform: scale(1.3); } }
    .scroll { margin: auto 0 0; padding: 1.5rem 1rem 2rem; color: #b7c9df; font-size: .8rem; letter-spacing: .12em; text-transform: uppercase; text-align: center; }
    @media (max-width: 600px) {
      .hero { justify-content: center; }
      .intro { padding-top: max(3rem, env(safe-area-inset-top)); }
      .scene { width: 116%; flex: none; margin: 3.5rem auto 0; left: 50%; transform: translateX(-50%); }
      .scroll { margin-top: auto; }
    }
    @media (prefers-reduced-motion: reduce) { .ripple { animation: none; opacity: .25; } }
  </style>
</head>
<body>
  <main>
    <section class="hero" aria-labelledby="name">
      <div class="intro">
        <h1 id="name">Philip Brocoum</h1>
        <p>Lead Software Engineer · Portland, Oregon</p>
      </div>
      <div class="scene" role="img" aria-label="A developer coding beside a campfire on a tiny island in a pine-lined lake at night">
        <img src="island.webp" width="1280" height="720" alt="" fetchpriority="high">
        <div class="water" aria-hidden="true">
          <span class="ripple" style="--x: 7%; --y: 76%; --w: 8%; --delay: -1s"></span>
          <span class="ripple" style="--x: 79%; --y: 72%; --w: 9%; --delay: -3s"></span>
          <span class="ripple" style="--x: 24%; --y: 86%; --w: 7%; --delay: -4.5s"></span>
          <span class="ripple" style="--x: 66%; --y: 90%; --w: 8%; --delay: -2s"></span>
        </div>
      </div>
      <p class="scroll">A little island on the web</p>
    </section>
  </main>
</body>
</html>
