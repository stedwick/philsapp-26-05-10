<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>fal.ai 5-layer parallax — OLD vs ROUND 2 vs ROUND 3 vs ROUND 3 city-lights-2</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  html, body { height: 100%; overflow: hidden; background: #0f170a; }
  body { display: flex; font-family: system-ui, sans-serif; }
  .pane { position: relative; flex: 1 1 25%; min-width: 0; }
  .pane + .pane { border-left: 2px solid #22331a; }
  .pane iframe {
    display: block;
    width: 100%;
    height: 100vh;
    border: 0;
  }
  .badge {
    position: absolute;
    top: 10px;
    left: 10px;
    z-index: 10;
    padding: 6px 10px;
    border-radius: 6px;
    background: rgba(15, 23, 10, .82);
    color: #b8c9a8;
    font-size: 12px;
    line-height: 1.45;
    pointer-events: none;
    max-width: calc(100% - 20px);
  }
  .badge b { color: #fff; font-size: 13px; }
</style>
</head>
<body>

<div class="pane">
  <div class="badge"><b>OLD</b> — commit 90f4674<br>city behind hills, all layers 100%</div>
  <iframe id="f-old" src="compare-old.html" title="Old composition (commit 90f4674)"></iframe>
</div>

<div class="pane">
  <div class="badge"><b>ROUND 2</b> — w-t-city<br>vignette, 130svh, mtn 0.75, clamped stop</div>
  <iframe id="f-mid" src="variant-wtcity.html" title="Round 2 with w-t-city layer"></iframe>
</div>

<div class="pane">
  <div class="badge"><b>ROUND 3</b> — working tree<br>pinned end state, sky anchor; city-lights</div>
  <iframe id="f-new" src="variant.html" title="Round 3: pinned end state with city-lights layer"></iframe>
</div>

<div class="pane">
  <div class="badge"><b>ROUND 3</b> — city-lights-2<br>same as pane 3 but city A/B candidate</div>
  <iframe id="f-city2" src="variant-city2.html" title="Round 3 with city-lights-2 candidate layer"></iframe>
</div>

<script>
  // Scroll sync relay: child pages postMessage their scrollY; broadcast to
  // the other iframes. postMessage because file:// iframes are cross-origin.
  var frames = {
    old: document.getElementById('f-old'),
    mid: document.getElementById('f-mid'),
    new: document.getElementById('f-new'),
    city2: document.getElementById('f-city2')
  };
  window.addEventListener('message', function (e) {
    var d = e.data;
    if (!d || !d.parallaxSync || d.target) return;
    Object.keys(frames).forEach(function (side) {
      if (side === d.side) return;
      frames[side].contentWindow.postMessage(
        { parallaxSync: true, target: side, y: d.y }, '*'
      );
    });
  });
</script>

</body>
</html>
