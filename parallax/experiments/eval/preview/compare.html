<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Parallax preview — OLD vs NEW</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  html, body { height: 100%; overflow: hidden; background: #021935; }
  body { display: flex; font-family: system-ui, sans-serif; }
  .pane { position: relative; flex: 1 1 50%; min-width: 0; }
  .pane + .pane { border-left: 2px solid #0b2c52; }
  .pane iframe {
    display: block;
    width: 100%;
    height: 100vh;
    border: 0;
  }
  .badge {
    position: absolute;
    top: 10px;
    left: 10px;
    z-index: 10;
    padding: 6px 10px;
    border-radius: 6px;
    background: rgba(2, 25, 53, .82);
    color: #c3d2ec;
    font-size: 12px;
    line-height: 1.45;
    pointer-events: none;
    max-width: calc(100% - 20px);
  }
  .badge b { color: #fff; font-size: 13px; }
</style>
</head>
<body>

<div class="pane">
  <div class="badge"><b>OLD</b> — commit 70aa9e6<br>SAM cuts + SDXL fills (original city mask)</div>
  <iframe id="f-old" src="../preview-old/index.html" title="Old preview (commit 70aa9e6)"></iframe>
</div>

<div class="pane">
  <div class="badge"><b>NEW</b> — working tree<br>re-cut city (BiRefNet), defringed trees, FLUX.1 [pro] Fill (fal.ai)</div>
  <iframe id="f-new" src="compare-new.html" title="New preview (working tree)"></iframe>
</div>

<script>
  // Scroll sync relay: child pages postMessage their scrollY; relay to the
  // other iframe. postMessage because file:// iframes are cross-origin.
  var frames = {
    old: document.getElementById('f-old'),
    new: document.getElementById('f-new')
  };
  window.addEventListener('message', function (e) {
    var d = e.data;
    if (!d || !d.parallaxSync || d.target) return;
    var other = d.side === 'old' ? 'new' : 'old';
    frames[other].contentWindow.postMessage(
      { parallaxSync: true, target: other, y: d.y }, '*'
    );
  });
</script>

</body>
</html>
